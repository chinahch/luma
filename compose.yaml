name: luma
services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: luma
      POSTGRES_USER: luma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U luma -d luma]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    image: luma-api:${LUMA_VERSION:-0.1.0-preview}
    build:
      context: .
    environment:
      DATABASE_URL: postgres://luma:${POSTGRES_PASSWORD}@db:5432/luma?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LISTEN_ADDR: :8080
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8088}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TZ: ${TZ:-UTC}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, /usr/local/bin/luma, healthcheck]
      interval: 10s
      timeout: 4s
      retries: 10
    read_only: true
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  web:
    image: luma-web:${LUMA_VERSION:-0.1.0-preview}
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8088}:8080
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
